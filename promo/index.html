<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Orbe — vídeo promocional</title>
  <link rel="stylesheet" href="promo.css">
</head>
<body>
  <div id="frame">
    <div id="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

    <!-- 1 · intro -->
    <section id="intro">
      <div class="logo" id="intro-logo"></div>
      <h1 id="intro-word"></h1>
      <p id="intro-tag">Tus apps, a un gesto del borde de la pantalla.</p>
    </section>

    <!-- 2–5 · escritorio -->
    <section id="desk">
      <div class="win light" id="w1"><b></b><span></span><span></span><span class="short"></span><span></span><span class="short"></span></div>
      <div class="win dark" id="w2"><b></b><span></span><span class="short"></span><span></span></div>
      <div class="win app" id="spotify">
        <header><img src="../src/img/apps/spotify.png" alt=""><strong>Spotify</strong></header>
        <div class="app-body">
          <nav><span></span><span></span><span></span><span class="short"></span></nav>
          <div class="cards"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <footer><i class="play"></i><i class="bar"><i id="progress"></i></i></footer>
      </div>
      <div id="taskbar"><i></i><i></i><i></i><i></i><i></i></div>

      <div id="shade"></div>
      <div id="ghost"></div>
      <div id="zone"><span>Arrástrame</span></div>
      <div id="card">
        <h2>Coloca la zona</h2>
        <p>Arrastra el círculo al punto donde quieres esconder Orbe.</p>
        <div class="row"><i class="btn">Cancelar</i><i class="btn primary" id="save-btn">Guardar zona</i></div>
      </div>

      <div id="wheel"><div id="plate"></div><div id="hub"></div></div>
      <div id="ripple"></div>
    </section>

    <!-- 6 · funciones -->
    <section id="features">
      <h2 id="feat-title">Hecho para tu escritorio</h2>
      <div id="feat-icons"></div>
      <div id="feat-chips"></div>
    </section>

    <!-- 7 · cierre -->
    <section id="outro">
      <div class="logo" id="outro-logo"></div>
      <h1>Orbe</h1>
      <p class="url">github.com/bagpotato/orbe</p>
      <p class="meta">Windows 10/11 · Tauri 2 · Rust · Código abierto</p>
    </section>

    <div id="caption"><small id="cap-k"></small><strong id="cap-t"></strong></div>
    <svg id="cursor" viewBox="0 0 24 24" width="50" height="50"><path d="M4 2.5v17.2l4.6-4.3 2.9 6.6 2.9-1.3-2.9-6.5h6.3z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
    <div id="scroll-hint"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="6"/><path d="M12 6.5v4"/></svg><i></i><i></i></div>
    <div id="fade"></div>
  </div>

  <script src="../src/glyphs.js"></script>
  <script src="../src/geometry.js"></script>
  <script src="promo.js"></script>
</body>
</html>
