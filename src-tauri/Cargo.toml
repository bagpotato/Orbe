[package]
name = "orbe"
version = "0.1.0"
edition = "2021"

[lib]
name = "orbe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
toml = "0.8"
png = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_System_Com",
  "Win32_System_Shutdown",
  "Win32_Storage_FileSystem",
]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
